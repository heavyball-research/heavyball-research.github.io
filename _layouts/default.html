<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include theme.html %}
  {% seo %}
  <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% feed_meta %}
  {% if page.math or layout.math %}{% include mathjax.html %}{% endif %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/logo.png' | relative_url }}" alt="" width="32" height="32">
      <span>{{ site.title }}</span>
    </a>
    <nav>
      <a href="{{ '/people/' | relative_url }}">People</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ site.github_org }}">GitHub</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" hidden>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M20.9 13.1A9 9 0 0 1 10.9 3.1a9 9 0 1 0 10 10Z" />
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
      </svg>
    </button>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    Made by HeavyBall Research, NYU Shanghai.
    <a href="{{ '/blog/feed.xml' | relative_url }}">RSS</a>
  </footer>
</body>
</html>
